# Jaglosky fleet-ops — the agency's central repo: one cron for the whole app fleet.
name: Jaglosky fleet

on:
  schedule:
    - cron: "0 6 * * 1,4"   # Mon and Thu at 06:00 UTC
  workflow_dispatch:
    inputs:
      dispatch:
        description: "Autopilot: dispatch the agent in the app repos (per fleet-ops.yml)"
        type: boolean
        default: true

env:
  JAGLOSKY_LICENSE_KEY: ${{ secrets.JAGLOSKY_LICENSE_KEY }}   # rules feed + usage metering (from `jaglosky init`)
  JAGLOSKY_API: ${{ vars.JAGLOSKY_API }}                      # empty = no Jaglosky service: bundled rules, no metering

permissions:
  contents: write   # save state.json and reports/ in this repo

concurrency:
  group: jaglosky-fleet
  cancel-in-progress: false

jobs:
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      JAGLOSKY_APP_ID: ${{ secrets.JAGLOSKY_APP_ID }}
    steps:
      - id: app-token   # the Jaglosky GitHub App, scoped to every repo it is installed on
        if: env.JAGLOSKY_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.JAGLOSKY_APP_ID }}
          private-key: ${{ secrets.JAGLOSKY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: jaglosky/jaglosky/.github/actions/fleet@v1
        with:
          fleet-token: ${{ steps.app-token.outputs.token || secrets.FLEET_TOKEN }}
          dispatch: ${{ github.event_name == 'schedule' || inputs.dispatch }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          asc-key-id: ${{ secrets.JAGLOSKY_ASC_KEY_ID }}
          asc-issuer-id: ${{ secrets.JAGLOSKY_ASC_ISSUER_ID }}
          asc-key-p8: ${{ secrets.JAGLOSKY_ASC_KEY_P8 }}
